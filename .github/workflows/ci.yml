name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development adapters
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp,dev]"
      - name: Static checks
        run: ruff check src tests scripts
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Retrieval quality gate
        run: python scripts/run_retrieval_eval.py
      - name: Context dogfood outcome gate
        run: python scripts/run_dogfood_eval.py
      - name: Example-vault contract gate
        run: noesis vault validate examples/noesis-vault
      - name: Build distribution
        run: python -m build
